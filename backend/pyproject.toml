[project]
name = "quant-platform-backend"
version = "1.0.0"
description = "API-first quantitative financial intelligence platform - Satish: Data + Quant Math + Analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "yfinance>=0.2.43",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "qiskit>=2.5.2",
    "openai>=3.16.2",
    "psycopg2-binary>=2.9.13",
    "redis>=8.1.0",
    "slowapi>=0.1.9",
    "scikit-learn>=1.9.1",
    "pennylane>=0.45.1",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.49.0",
    "psycopg>=3.3.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
